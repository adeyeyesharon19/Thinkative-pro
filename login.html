<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGIN</title>
    <link rel="stylesheet" href="css/Login.css">
    <link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>
    <section class="log-in">
    <div class="wel-back">
            <h2>Thinkative</h2>
            <h3>Welcome back!</h3>
        </div>   

        <div class="log-box">
            <h4>New to Thinkative? 
               <!-- <a href="get started.html"><button>Sign up</button></a></h4> -->

               <a href="get started.html">Sign up now➡️</a>
              
            <h3>Log in to continue</h3>
            <p>How would you like to sign in?</p>
       <form id="login-form" action="in.html" method="GET">
         <label for="Name"></label>
        <input type="text" id="Name" name="Name" placeholder="Name" required> 
        


         <label for="password"></label>
        <input type="password" id="password" name="password" placeholder="Password" required>

        <button type="submit">LOG IN</button>
        <h5>Forgot password?</h5>
        
         <div class="social-icons"> 
  <!-- Twitter -->
  <a href="https://twitter.com" class="twitter" target="_blank">
    <i class="fa-brands fa-x-twitter"></i>
  </a>

  <!-- Instagram -->
  <a href="https://instagram.com" class="instagram" target="_blank">
    <i class="fa-brands fa-instagram"></i>
  </a>
  </div>
  <h6>By logging in, you agree to our <span> Terms of Service</span>, <br>
 <span>Privacy Policy</span> and <span>CA Privacy Policy</span>.</h6>
</div>

        

       </form>
    </section>
</body>
</html>
