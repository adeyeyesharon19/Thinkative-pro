<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Congratulations!</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap');
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: radial-gradient(circle at top, #ffafbd, #ffc3a0, #2193b0, #6dd5ed);
        overflow: hidden;
        font-family: 'Fredoka One', cursive;
    }
    .container {
        background: rgba(0,0,0,0.8);
        padding: 60px;
        border-radius: 25px;
        text-align: center;
        color: #fff;
        box-shadow: 0 0 30px rgba(255,255,255,0.2);
        position: relative;
        z-index: 1;
        max-width: 80%;
    }
    h1 { font-size: 60px; color: #f2ed61; text-shadow: 2px 2px 10px #ff4b5c; margin-bottom: 20px; }
    p { font-size: 28px; margin-bottom: 20px; }
    .score { font-size: 50px; color: #00ffe7; text-shadow: 1px 1px 5px #00bfff; }
    
    button {
        margin-top: 30px;
        padding: 15px 35px;
        font-size: 20px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(45deg, #ff4b5c, #ffac41);
        color: #fff;
        cursor: pointer;
        transition: transform 0.2s;
    }
    button:hover { transform: scale(1.1); }
    .finish-btn { background: linear-gradient(45deg, #00bfff, #1de9b6) !important; }

    .confetti {
        position: absolute;
        width: 10px; height: 10px; top: 0;
        animation: fall 3s linear infinite;
        opacity: 0.7; z-index: 0;
    }
    @keyframes fall { 0% { transform: translateY(0) rotate(0deg); } 100% { transform: translateY(100vh) rotate(360deg); } }
</style>
</head>
<body>

<div class="container">
    <h1 id="congrat-title">🎉 Congratulations! 🎉</h1>
    <p id="congrat-text">You completed the questions successfully</p>
    <div class="score" id="score">Score: 0/5</div>
    <button id="action-btn" onclick="handleContinue()">Continue</button>
</div>

<script>
    const lastSetScore = localStorage.getItem('first5_lastSetScore') || 0;
    let currentStage = parseInt(localStorage.getItem('quiz_stage')) || 1;
    
    const scoreElement = document.getElementById('score');
    const actionBtn = document.getElementById('action-btn');
    const congratTitle = document.getElementById('congrat-title');
    const congratText = document.getElementById('congrat-text');

    // Updated with all 9 modules to reach 45 questions
    function getTotalScore() {
        const allScoreKeys = [
            'first5_score',      // Stage 1
            'brandana_score',    // Stage 2
            'brandblend_score',  // Stage 3
            'intraswap_score',   // Stage 4
            'swapmark_score',    // Stage 5
            'revertamark_score', // Stage 6
            'brandlink_score',   // Stage 7
            'brandcombo_score',  // Stage 8
            'final_score'        // Stage 9
        ];

        let total = 0;
        allScoreKeys.forEach(key => {
            total += parseInt(localStorage.getItem(key)) || 0;
        });
        return total;
    }

    scoreElement.innerText = `Score: ${lastSetScore}/5`;

    if (currentStage === 9) {
        const grandTotal = getTotalScore();
        congratTitle.innerText = "🏆 Course Completed! 🏆";
        congratText.innerHTML = `Amazing work! You finished the <b>Brand Brain</b> course.<br>Total Score: <b>${grandTotal} / 45</b>`;
        scoreElement.style.display = 'none';
        actionBtn.innerText = "Finish Course";
        actionBtn.classList.add('finish-btn');
    }

    function handleContinue() {
        let nextURL = '';

        // ROUTING LOGIC FOR ALL 9 STAGES
        if (currentStage === 1) {
            nextURL = 'BRANDANAINTRO.html';
        } 
        else if (currentStage === 2) {
            nextURL = 'PPBRANDINTRO.html';
        } 
        else if (currentStage === 3) {
            nextURL = 'BRANDBLENDINTRO.html';
        } 
        else if (currentStage === 4) {
            nextURL = 'INTRASWAPINTRO.html';
        } 
        else if (currentStage === 5) {
            nextURL = 'BRANDLINKINTRO.html';
        } 
        else if (currentStage === 6) {
            nextURL = 'SWAPMARKINTRO.html';
        } 
        else if (currentStage === 7) {
            nextURL = 'REVERTAMARKINTRO.html';
        } 
         else if (currentStage === 8) {
            nextURL = 'BRANDCOMBOINTRO.html';
        } 
        // else if (currentStage === 8) {
        //     // This assumes your 9th module is the final one
        //     nextURL = 'FINALMODULEINTRO.html'; 
        // } 
        else if (currentStage === 9) {
            const finalScore45 = getTotalScore();
            let certificates = JSON.parse(localStorage.getItem('completed_courses')) || [];

            const newCert = {
                id: 'CB' + Math.floor(100 + Math.random() * 900),
                name: 'Brand Brain',
                date: new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }),
                marks: finalScore45,
                total: 45
            };

            certificates.push(newCert);
            localStorage.setItem('completed_courses', JSON.stringify(certificates));
            nextURL = 'certificate.html';
        }

        window.location.href = nextURL;
    }

    // Confetti
    for(let i = 0; i < 100; i++){
        const confetti = document.createElement('div');
        confetti.classList.add('confetti');
        confetti.style.left = Math.random() * 100 + 'vw';
        confetti.style.backgroundColor = `hsl(${Math.random() * 360}, 100%, 50%)`;
        confetti.style.animationDuration = 2 + Math.random() * 3 + 's';
        confetti.style.width = 5 + Math.random() * 10 + 'px';
        confetti.style.height = 5 + Math.random() * 10 + 'px';
        document.body.appendChild(confetti);
    }
</script>
</body>
</html>
