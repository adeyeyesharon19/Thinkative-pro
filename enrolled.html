<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enrolled</title>

    <link rel="stylesheet" href="css/enrolled.css">
</head>

<body>
    <header>
        <div class="sidebar">
            <h2>Dashboard</h2>

            <a href="dash.html" class=""> Home</a>
            <a href="profile.html">My Profile </a>
                 <a href="courses.html"> Courses </a>
            <a href="enrolled.html">Enrolled courses
            </a>
            <a href="certificate.html">My Certificate</a>
              <a href="review.html">Review</a>
            <a href="#">Reports</a>
            <a href="#"> Settings</a>
            <a href="#">Logout</a>
        </div>

    </header>


   <main>
    <section class="roll">
        <div class="arc">
            <h2>Enrolled courses</h2>
            <div class="en">
                <button class="end" id="count-enrolled">Enrolled (0)</button>
                <button class="tv" id="count-active">Active (0)</button>
                <button class="tv" id="count-completed">Completed (0)</button>
            </div>
        </div>
    </section>

    <section id="enrolled-list" class="course-grid">
        </section>
</main>
      
    



</body>
<script>
document.addEventListener('DOMContentLoaded', () => {
    const courseContainer = document.getElementById('enrolled-list');
    const enrolledCountBtn = document.getElementById('count-enrolled');
    const activeCountBtn = document.getElementById('count-active');
    const completedCountBtn = document.getElementById('count-completed');
    
    const enrolledCourses = JSON.parse(localStorage.getItem('enrolledCourses')) || [];

    enrolledCountBtn.textContent = `Enrolled (${enrolledCourses.length})`;
    
    const activeCount = enrolledCourses.filter(c => !c.isCompleted).length;
    activeCountBtn.textContent = `Active (${activeCount})`;

    const completedCount = enrolledCourses.filter(c => c.isCompleted === true).length;
    completedCountBtn.textContent = `Completed (${completedCount})`;

    if (enrolledCourses.length === 0) {
        courseContainer.innerHTML = `
            <div style="padding: 20px; text-align: center; color: #666;">
                <p>You haven't enrolled in any courses yet.</p>
                <a href="courses.html" style="color: #007bff;">Browse Courses</a>
            </div>`;
    } else {
        courseContainer.innerHTML = ''; 
        
        enrolledCourses.forEach(course => {
            const imageSrc = course.image || 'image/default-course.jpg';

            // --- LOGIC FOR COMPLETION ---
            const isFinished = course.isCompleted === true;
            const buttonText = isFinished ? "Completed" : "Continue Learning";
            const buttonColor = isFinished ? "#28a745" : "#007bff"; 
            const statusLabel = isFinished ? "Completed" : "Active";
            const statusColor = isFinished ? "blue" : "green";

            // --- NEW LOGIC FOR MULTIPLE LINKS ---
            // This checks the title and assigns the correct page
            let coursePage = "learning.html"; // Default page

            if (course.title === "Brand Brain") {
                coursePage = "learning brand.html"; // Change this to your actual brand brain filename
            } else if (course.title === "Anagram Intelligence") {
                coursePage = "learning.html";
            }

            const courseHTML = `
                <div class="course-card" style="border: 1px solid #ddd; padding: 15px; margin: 10px; border-radius: 8px; display: inline-block; width: 250px;">
                    <img src="${imageSrc}" alt="${course.title}" style="width: 100%; height: 150px; object-fit: cover; border-radius: 5px;">
                    <h3 style="margin: 10px 0;">${course.title}</h3>
                    <p style="color: ${statusColor}; font-weight: bold;">Status: ${statusLabel}</p>
                    <a href="${coursePage}" style="text-decoration: none;">
                        <button style="background: ${buttonColor}; color: white; border: none; padding: 8px; width: 100%; border-radius: 4px; cursor: pointer; margin-top:10px;">${buttonText}</button>
                    </a>
                </div>
            `;
            courseContainer.innerHTML += courseHTML;
        });
    }
});
</script>
</html>
