<body>

    </header>

    <main>
        <section>
            <div>

                <div class="profile-container">
                    <h1>My Profile</h1>
                    <form action="#" method="post" class="profile-form">
                        <!-- First Row -->
                        <div class="form-group">
                            <label for="first-name">First Name</label>
                            <input type="text" id="first-name" name="first-name" value="Ronald" readonly>
                        </div>
                        <div class="form-group">
                            <label for="last-name">Last Name</label>
                            <input type="text" id="last-name" name="last-name" value="Record" readonly>
                        </div>
                        <div class="form-group">
                            <label for="registration-date">Registration Date</label>
                            <input type="text" id="registration-date" name="registration-date"
                                value="16 Jan 2024, 11:15 AM" readonly>
                        </div>

                        <!-- Second Row -->
                        <div class="form-group">
                            <label for="username">User Name</label>
                            <input type="text" id="username" name="username" value="student800" readonly>
                        </div>
                        <div class="form-group">
                            <label for="phone">Phone Number</label>
                            <input type="tel" id="phone" name="phone" value="154-91036" readonly>
                        </div>
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" value="student@learning.com" readonly>
                        </div>

                        <!-- Third Row -->
                        <div class="form-group">
                            <label for="gender">Gender</label>
                            <input type="text" id="gender" name="gender" value="Male" readonly>
                        </div>
                        <div class="form-group">
                            <label for="dob">DOB</label>
                            <input type="text" id="dob" name="dob" value="01 Jan 1990" readonly>
                        </div>
                        <div class="form-group">
                            <label for="age">Age</label>
                            <input type="number" id="age" name="age" value="34" readonly>
                        </div>

                        <!-- Fourth Row (Bio) -->
                        <div class="form-group full-width">
                            <label for="bio">Bio</label>
                            <textarea id="bio" name="bio" rows="4"
                                readonly>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.</textarea>
                        </div>
                    </form>
                </div>
</body>

</html>

</div>
</section>
</main>
