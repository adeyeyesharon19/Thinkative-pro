<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Congratulations</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            padding-top: 50px;
        }

        img {
            width: 200px;
            margin: 20px 0;
        }

        button {
            padding: 12px 25px;
            font-size: 16px;
            cursor: pointer;
            background: rgb(47, 47, 223);
            color: #fff;
            border: none;
            border-radius: 10px;
        }

        /* Blur overlay */
        #blurOverlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(6px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            z-index: 10;
        }

        #blurOverlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        /* Certificate modal */
        #certificateNotice {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: #1e90ff;
            color: white;
            padding: 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 420px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            font-size: 18px;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: all 0.5s ease;
            z-index: 20;
        }

        #certificateNotice.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
            pointer-events: auto;
        }

        #certificateNotice button {
            margin-top: 20px;
            padding: 12px 25px;
            font-size: 16px;
            background: white;
            color: #1e90ff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>🎉 Congratulations! 🎉</h1>
    <img src="image/congratulations.png" alt="Congratulations">
    <h2 id="scoreText">Your Score: 0 / 5</h2>
    <button onclick="goNext()">Continue</button>

    <div id="blurOverlay"></div>

    <div id="certificateNotice">
        🎓 <h2>Congratulations!</h2>
        <p>
            You have received a certificate on<br>
            <strong>Anagram Intelligence</strong>
        </p>
        <button onclick="viewCertificate()">View My Certificate</button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {

            /* ================== Score Handling ================== */
            // Find the most recent lastSetScore in localStorage
            const lastSetScoreKeys = Object.keys(localStorage).filter(key => key.endsWith('_lastSetScore'));
            let score = 0;

            if (lastSetScoreKeys.length > 0) {
                const lastKey = lastSetScoreKeys[lastSetScoreKeys.length - 1];
                score = parseInt(localStorage.getItem(lastKey)) || 0;
            }

            document.getElementById('scoreText').textContent = `Your Score: ${score} / 5`;

            /* ================== Certificate Modal ================== */
            setTimeout(() => {
                document.getElementById('blurOverlay').classList.add('show');
                document.getElementById('certificateNotice').classList.add('show');
            }, 3000); // show after 3 seconds

            window.viewCertificate = function () {
                // Optional: mark certificate unlocked
                localStorage.setItem('anagram_certificate_unlocked', 'true');
                window.location.href = 'certificate.html';
            };

            /* ================== Continue Button ================== */
            window.goNext = function () {
                // Just hide the certificate if user hasn't seen it yet
                document.getElementById('blurOverlay').classList.remove('show');
                document.getElementById('certificateNotice').classList.remove('show');
            };
        });
    </script>
</body>
</html>
