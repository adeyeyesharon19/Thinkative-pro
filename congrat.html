<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Congratulations</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            padding-top: 50px;
        }

        img {
            width: 200px;
            margin: 20px 0;
        }

        button {
            padding: 12px 25px;
            font-size: 16px;
            cursor: pointer;
            background: rgb(47, 47, 223);
            color: #fff;
            border: none;
            border-radius: 10px;
        }

        /* Blur overlay */
        #blurOverlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(6px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            z-index: 10;
        }

        #blurOverlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        /* Certificate modal */
        #certificateNotice {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: #1e90ff;
            color: white;
            padding: 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 420px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            font-size: 18px;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: all 0.5s ease;
            z-index: 20;
        }

        #certificateNotice.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
            pointer-events: auto;
        }

        #certificateNotice button {
            margin-top: 20px;
            padding: 12px 25px;
            font-size: 16px;
            background: white;
            color: #1e90ff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
    </style>
</head>

<body>



    <h1>🎉 Congratulations! 🎉</h1>
    <img src="image/congratulations.png" alt="Congratulations">
    <h2 id="scoreText">Your Score: 0 / 5</h2>
    <button onclick="goNext()">Continue</button>

    <div id="blurOverlay"></div>

    <div id="certificateNotice">
        🎓 <h2>Congratulations!</h2>
        <p>
            You have received a certificate on<br>
            <strong>Anagram Intelligence</strong>
        </p>
        <button onclick="viewCertificate()">View My Certificate</button>
    </div>


</body>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const scoreText = document.getElementById('scoreText');
        const referrer = document.referrer.toLowerCase();
        
        /* ================== 1. Accurate Score Handling ================== */
        let score = 0;
        const allKeys = Object.keys(localStorage);
        
        // 1a. Find the level keyword from the URL
        let levelKeyword = "";
        if (referrer.includes('back')) levelKeyword = 'back';
        else if (referrer.includes('plug')) levelKeyword = 'plug';
        else if (referrer.includes('flip')) levelKeyword = 'flip';
        else if (referrer.includes('wordpick')) levelKeyword = 'wordpick';
        else if (referrer.includes('math')) levelKeyword = 'math';
        else if (referrer.includes('phrase')) levelKeyword = 'phrase';
        else if (referrer.includes('meaning')) levelKeyword = 'meaning';
        else if (referrer.includes('split')) levelKeyword = 'split';
        else if (referrer.includes('riddle')) levelKeyword = 'riddle';

        // 1b. Get the specific score for THIS level only
        const bestKey = allKeys.find(k => k.toLowerCase().includes(levelKeyword) && k.endsWith('_lastSetScore'));

        if (bestKey) {
            score = parseInt(localStorage.getItem(bestKey)) || 0;
        }

        scoreText.textContent = `Your Score: ${score} / 5`;

        /* ================== 2. Navigation & Score Refresh ================== */
        window.goNext = function () {
            
            // --- REFRESH LOGIC ---
            // This deletes the old score key so the next level starts fresh
            if (bestKey) {
                localStorage.removeItem(bestKey);
            }

            // --- NAVIGATION ---
            if (referrer.includes('back') && referrer.includes('front')) {
                window.location.href = 'anagramplugintro.html';
            } 
            else if (referrer.includes('anagram') && referrer.includes('plug')) {
                window.location.href = 'flipconnectintro.html';
            }
            else if (referrer.includes('flip') && referrer.includes('connect')) {
                window.location.href = 'wordpickIQintro.html';
            }
            else if (referrer.includes('wordpick')) {
                window.location.href = 'anagramathintro.html';
            }
            else if (referrer.includes('math') && !referrer.includes('meaning')) {
                window.location.href = 'smartphraseintro.html';
            }
            else if (referrer.includes('smart') && referrer.includes('phrase')) {
                window.location.href = 'meaningmathintro.html';
            }
            else if (referrer.includes('meaning')) {
                window.location.href = 'splitanagramintro.html';
            }
            else if (referrer.includes('split')) {
                window.location.href = 'riddlegramintro.html';
            }
            else if (referrer.includes('riddlegram5')) {
                window.location.href = 'dashboard.html';
            }
            else {
                window.location.href = 'dashboard.html';
            }
        };

        /* ================== 3. Final Certificate Logic ================== */
        if (referrer.includes('riddlegram5')) {
            setTimeout(() => {
                document.getElementById('blurOverlay').classList.add('show');
                document.getElementById('certificateNotice').classList.add('show');
            }, 2000);

            // Mark course as complete
            let enrolled = JSON.parse(localStorage.getItem('enrolledCourses')) || [];
            let updated = enrolled.map(course => {
                if (course.title === "Anagram Intelligence") course.isCompleted = true;
                return course;
            });
            localStorage.setItem('enrolledCourses', JSON.stringify(updated));
        }

        window.viewCertificate = function () {
            localStorage.setItem('anagram_certificate_unlocked', 'true');
            window.location.href = 'certificate.html';
        };
    });
</script>

</html>
