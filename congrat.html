<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Congratulations</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
       <link rel="icon" href="image/favicon2.png">
<link rel="icon" type="image/png" sizes="32x32" href="image/favicon2.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: radial-gradient(circle at top, #ffffff 0%, #e3f2fd 40%, #bbdefb 100%);
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        .info-card {
            background: #ffffff;
            padding: 50px 40px;
            border-radius: 35px;
            box-shadow: 0 20px 40px rgba(0, 80, 180, 0.1);
            width: 90%;
            max-width: 440px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.8);
            position: relative;
            z-index: 10;
            transition: opacity 0.5s ease;
        }

        #completionSlide {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            background: #ffffff;
            padding: 40px;
            border-radius: 35px;
            box-shadow: 0 40px 80px rgba(0, 20, 50, 0.3);
            width: 85%;
            max-width: 420px;
            z-index: 100;
            text-align: center;
            opacity: 0;
            display: none;
            border: 5px solid #001f3f;
        }

        #completionSlide.show {
            display: block;
            animation: popCenter 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popCenter {
            to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        #scoreText {
            font-size: 1.6rem;
            font-weight: 800;
            color: #2c3e50;
            background: #f0f7ff;
            display: inline-block;
            padding: 12px 35px;
            border-radius: 100px;
            border: 2px solid #001f3f;
            margin-bottom: 30px;
        }

        .final-score-grid {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin: 20px 0 20px;
        }
        .final-score-box {
            background: #f0f7ff;
            border: 2px solid #001f3f;
            border-radius: 14px;
            padding: 14px 18px;
            min-width: 76px;
        }
        .final-score-box .val {
            font-size: 22px;
            font-weight: 800;
            color: #001f3f;
        }
        .final-score-box .lbl {
            font-size: 10px;
            color: #64748b;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 4px;
        }
        .grade-badge {
            display: inline-block;
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 22px;
        }
        .grade-pass   { background: #dcfce7; color: #166534; }
        .grade-medium { background: #fef9c3; color: #854d0e; }
        .grade-low    { background: #fee2e2; color: #991b1b; }

        button#mainBtn,
        .slide-btn {
            width: 100%;
            padding: 18px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            background: #001f3f;
            color: #ffffff;
            border: none;
            border-radius: 18px;
            text-transform: uppercase;
            transition: background 0.2s, transform 0.2s;
        }
        button#mainBtn:hover,
        .slide-btn:hover {
            background: #1da1f2;
            transform: translateY(-2px);
        }
    </style>
</head>

<body>
    <canvas id="confetti-canvas"
        style="position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1;"></canvas>

    <!-- Per-set score card -->
    <div class="info-card" id="mainCard">
        <h1 style="color:#1565c0;">GREAT JOB!</h1>
        <img src="image/congratulations.png" alt="Celebration" style="width:170px;margin:20px 0;">
        <div>
            <div id="scoreText">SCORE: 0 / 5</div>
        </div>
        <button id="mainBtn" onclick="goNext()">Continue</button>
    </div>

    <!-- Final course completion overlay -->
    <div id="completionSlide">
        <div style="font-size:56px;margin-bottom:10px;">🏆</div>
        <h2 style="color:#001f3f;margin-bottom:6px;">CONGRATULATIONS!</h2>
        <p style="color:#475569;margin-bottom:6px;">
            You have completed the entire<br><strong>Anagram Intelligence</strong> course.
        </p>

        <div class="final-score-grid">
            <div class="final-score-box">
                <div class="val" id="finalScore">—</div>
                <div class="lbl">Score</div>
            </div>
            <div class="final-score-box">
                <div class="val">45</div>
                <div class="lbl">Total</div>
            </div>
            <div class="final-score-box">
                <div class="val" id="finalPct">—</div>
                <div class="lbl">Grade</div>
            </div>
        </div>

        <div class="grade-badge" id="gradeBadge"></div>

        <button class="slide-btn" onclick="goToCertificate()">🎓 VIEW CERTIFICATE</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="certificate-engine.js"></script>  <!-- ✅ FIX 1: replaced score-tracker.js -->
    <script src="tracker.js"></script>
</body>

<script>
document.addEventListener('DOMContentLoaded', () => {

    const scoreDisplay = document.getElementById('scoreText');
    const referrer     = document.referrer.toLowerCase();
    const allKeys      = Object.keys(localStorage);

    /* ── STEP 1: Find & bank this set's score ── */
    const lastSetKey = allKeys.find(k => k.endsWith('_lastSetScore'));

    if (lastSetKey) {
        const rawScore      = parseInt(localStorage.getItem(lastSetKey), 10) || 0;
        const accurateScore = rawScore > 5 ? rawScore % 6 : rawScore;

        scoreDisplay.textContent = `SCORE: ${accurateScore} / 5`;

        // Add to master cumulative score
        let masterScore = parseInt(localStorage.getItem('master_cumulative_score'), 10) || 0;
        masterScore += accurateScore;
        localStorage.setItem('master_cumulative_score', masterScore);

        // Wipe this set's keys so next set starts fresh
        const prefix = lastSetKey.split('_')[0];
        allKeys.forEach(key => {
            if (key.startsWith(prefix)) localStorage.removeItem(key);
        });
    }

    /* ── STEP 2: Confetti ── */
    confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });

    /* ── STEP 3: Check if this is the FINAL module ──
       ✅ FIX 2: also checks localStorage flag set by riddlegram5.html
       because document.referrer is unreliable in some browsers/setups  */
    const lastModule = localStorage.getItem('lastCompletedModule') || '';
    localStorage.removeItem('lastCompletedModule'); // clear after reading
    const isFinal = lastModule === 'riddlegram' || referrer.includes('riddlegram5');

    if (isFinal) {
        setTimeout(() => {

            // Fade out the per-set card
            document.getElementById('mainCard').style.opacity = '0.15';

            // Read the fully banked master total
            const masterTotal = parseInt(localStorage.getItem('master_cumulative_score'), 10) || 0;
            const pct         = Math.round((masterTotal / 45) * 100);

            // ── Populate the completion slide ──
            document.getElementById('finalScore').textContent = masterTotal;
            document.getElementById('finalPct').textContent   = pct + '%';

            const badge = document.getElementById('gradeBadge');
            if (pct >= 75) {
                badge.textContent = '🌟 Excellent — Distinction!';
                badge.className   = 'grade-badge grade-pass';
            } else if (pct >= 50) {
                badge.textContent = '👍 Good — Pass';
                badge.className   = 'grade-badge grade-medium';
            } else {
                badge.textContent = '📚 Keep Practising';
                badge.className   = 'grade-badge grade-low';
            }

            // ✅ FIX 3: use certificate-engine to save (reads master AFTER banking)
            window.saveFinalCertificate();

            // ── Show completion slide + extra confetti ──
            document.getElementById('completionSlide').classList.add('show');
            confetti({ particleCount: 200, colors: ['#001f3f', '#ffffff', '#1da1f2'] });

        }, 1800);
    }

    /* ── STEP 4: Continue button — navigate to next section ── */
    window.goNext = function () {
        if      (isFinal)                               window.location.href = 'certificate.html';
        else if (referrer.includes('backtofront') ||
                 referrer.includes('spark'))            window.location.href = 'anagramplugintro.html';
        else if (referrer.includes('plug'))             window.location.href = 'flipconnectintro.html';
        else if (referrer.includes('flip'))             window.location.href = 'wordpickIQintro.html';
        else if (referrer.includes('wordpick'))         window.location.href = 'anagramathintro.html';
        else if (referrer.includes('anagramath') ||
                 referrer.includes('math'))             window.location.href = 'smartphraseintro.html';
        else if (referrer.includes('smart'))            window.location.href = 'meaningmathintro.html';
        else if (referrer.includes('meaning'))          window.location.href = 'splitanagramintro.html';
        else if (referrer.includes('split'))            window.location.href = 'riddlegramintro.html';
        else                                            window.location.href = 'enroll.html';
    };

    /* ── STEP 5: Go to certificate page ── */
    window.goToCertificate = function () {
        window.location.href = 'certificate.html';
    };

});
</script>

</html>
