<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get started</title>
    <link rel="stylesheet" href="css/getstarted.css">


    

</head>
<body>
    <section class="get-started">
      <div class="wel-back">
            <h2>Thinkative</h2>
            <h3>Discover what your <br> <span>mind can do.</span></h3>
            <h4>Sign up to train your brain</h4>
        </div>   

        <div class="log-box">
            <h3>Create your account</h3>
            <h4>Already a member?<a href="login.html"><button>LOG IN</button></a></h4>

           
            <form id="login-form" action="in.html" method="GET">

        <input type="text" id="Name" name="Name" placeholder="Name" required> 
        <label for="Name"></label>
        
         <label for="email"></label>
        <input type="email" id="email" name="email" placeholder="Email" required>

         <label for="password"></label>
        <input type="password" id="password" name="password" placeholder="Password" required>

        
        
        <div class="dob-container">
  <label for="dob-month">What is your date of birth?</label>
  <div class="dob-select">
    <select id="dob-month" name="month" required>
      <option value="" disabled selected>Month</option>
      <option value="1">January</option>
      <option value="2">February</option>
      <option value="3">March</option>
      <option value="4">April</option>
      <option value="5">May</option>
      <option value="6">June</option>
      <option value="7">July</option>
      <option value="8">August</option>
      <option value="9">September</option>
      <option value="10">October</option>
      <option value="11">November</option>
      <option value="12">December</option>
    </select>

    <select id="dob-day" name="day" required>
      <option value="" disabled selected>Day</option>

      <option>1</option><option>2</option><option>3</option>
      <option>4</option><option>5</option><option>6</option>
      <option>7</option><option>8</option><option>9</option>
      <option>10</option><option>11</option><option>12</option>
      <option>13</option><option>14</option><option>15</option>
      <option>16</option><option>17</option><option>18</option>
      <option>19</option><option>20</option><option>21</option>
      <option>22</option><option>23</option><option>24</option>
      <option>25</option><option>26</option><option>27</option>
      <option>28</option><option>29</option><option>30</option>
    </select>

    <select id="dob-year" name="year" required>
      <option value="" disabled selected>Year</option>
      <option>2024</option><option>2023</option><option>2022</option>
      <option>2021</option><option>2020</option><option>2019</option>
      <option>2018</option><option>2017</option><option>2016</option>
      <option>2015</option><option>2014</option> <option>2013</option> <option>2012</option><option>2011</option><option>2010</option><option>2009</option><option>2008</option><option>2007</option><option>2006</option><option>2005</option><option>2004</option><option>2003</option><option>2002</option><option>2001</option><option>2000</option>
    </select>
  </div>
  <h6>By logging in, you agree to our <span> Terms of Service</span>, <br>
 <span>Privacy Policy</span> and <span>CA Privacy Policy</span>.</h6>

 <button class="create-acc" type="submit">Create your account</button>

  <div class="social-icons"> 
  <!-- Twitter -->
  <a href="https://twitter.com" class="twitter" target="_blank">
    <i class="fa-brands fa-x-twitter"></i>
  </a>

  <!-- Instagram -->
  <a href="https://instagram.com" class="instagram" target="_blank">
    <i class="fa-brands fa-instagram"></i>
  </a>
  </div>
</div>

<script src="js/register.js"></script>

</body>
  </html>
